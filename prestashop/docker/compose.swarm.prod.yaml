# PG Student Cluster - Production Deployment
#
# Deployment:
#   docker stack deploy -c compose.swarm.prod.yaml RSWW_12345 --with-registry-auth
#
# Create database first:
#   - SSH tunnel: ssh -L 9099:student-swarm01.maas:9099 rsww@172.20.83.101
#   - Open phpMyAdmin: http://localhost:9099
#   - Create database: RSWW_12345
#   - Credentials: root / student
#
# Access your app:
#   ssh -L 8443:student-swarm01.maas:19542 rsww@172.20.83.101
#   Open: https://localhost:8443

services:
  caddy:
    image: ghcr.io/vv01t3k/some-pg-action-prestashop/caddy:latest
    hostname: caddy
    ports:
      - 19542:443
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - prestashop_src:/var/www/html:ro
    environment:
      - SHOP_DOMAIN=shop.example.com
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  prestashop:
    image: ghcr.io/vv01t3k/some-pg-action-prestashop/prestashop:latest
    hostname: prestashop
    volumes:
      - prestashop_src:/var/www/html
    environment:
      DB_HOST: student-swarm01.maas
      DB_PORT: 3306
      DB_NAME: RSWW_12345
      DB_USER: root
      DB_PASSWORD: student
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  valkey:
    image: valkey/valkey:9-alpine
    hostname: valkey
    command: [ "valkey-server", "--appendonly", "yes" ]
    expose:
      - 6379
    volumes:
      - valkey_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  prestashop_src:
  caddy_data:
  caddy_config:
  valkey_data:

networks:
  backend:
    name: ${STACK_PREFIX}_backend
    driver: overlay


