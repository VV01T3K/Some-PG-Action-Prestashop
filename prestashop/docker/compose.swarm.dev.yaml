# Local Development - Mimics PG Student Cluster
# Uses local DB from compose.swarm.db.yaml
#
# Usage:
#   docker stack deploy -c compose.swarm.db.yaml ${STACK_PREFIX}_db
#   docker stack deploy -c compose.swarm.dev.yaml ${STACK_PREFIX}

services:
  caddy:
    image: ghcr.io/vv01t3k/some-pg-action-prestashop/caddy:swarm-setup
    hostname: caddy
    # Port exposed via gateway in compose.swarm.db.yaml
    # expose:
    #   - 433
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - prestashop_src:/var/www/html:ro
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
    networks:
      - backend
      - gateway
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  prestashop:
    image: ghcr.io/vv01t3k/some-pg-action-prestashop/prestashop:swarm-setup
    hostname: prestashop
    volumes:
      - prestashop_src:/var/www/html
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_BACKUP_KEY: ${DB_BACKUP_KEY}
    networks:
      - backend
      - db-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  valkey:
    image: valkey/valkey:9-alpine
    hostname: valkey
    command: [ "valkey-server", "--appendonly", "yes" ]
    # expose:
    #   - 6379
    volumes:
      - valkey_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    mailhog:
      image: mailhog/mailhog:latest
      hostname: mailhog
      # expose:
      #   - 1025 # SMTP
      #   - 8025 # Web UI
      networks:
        - backend
      deploy:
        replicas: 1
        restart_policy:
          condition: on-failure
          delay: 5s
          max_attempts: 3
        resources:
          limits:
            cpus: '0.25'
            memory: 128M
          reservations:
            cpus: '0.05'
            memory: 32M

volumes:
  prestashop_src:
  caddy_data:
  caddy_config:
  valkey_data:

networks:
  backend:
    name: ${STACK_PREFIX}_backend
    driver: overlay
  db-network:
    name: ${STACK_PREFIX}_db_db-network
    external: true
  gateway:
    name: ${STACK_PREFIX}_db_gateway
    external: true
